name: CI

on:
  pull_request:

# Keep only the latest run for each PR; retain each repository's own suite.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install (with dev deps)
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check mindgraph/

      # Offline contract tests only. The live prod-mutating E2E
      # (tests/test_integration.py) SKIPS here because MINDGRAPH_E2E is unset,
      # so no API key / network is required.
      - name: Test (offline)
        run: pytest -q
